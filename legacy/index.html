<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>נוכחות חוגים – גרעין אומץ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE practical and warm: a tool used on a phone in a hallway minutes before class
   IDEA the paper attendance register (יומן נוכחות) under the flag-blue band of the logo
   PICTURE the working thing itself: today's classes, then the tick list, then the ruled register
   COLOUR white ground, flag blue leads and means "arrived", stone panels, brick for absent, bronze for notes
   TYPE Rubik 800 for headings + Assistant for text, both full Hebrew
   LAYOUT phone: one column with a sticky tally dock; laptop: roster beside a sticky tally panel, wide ruled tables */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0c1220);--panel:light-dark(#f4f1eb,#141c2c);--panel2:light-dark(#e9e3d8,#1d2740);
--line:light-dark(#e1dace,#27324a);--ink:light-dark(#111826,#edf0f6);--mute:light-dark(#5a6372,#9aa5bb);
--blue:light-dark(#1847a8,#82a6f4);--on:light-dark(#ffffff,#0c1220);--blue-soft:light-dark(#e8eefc,#17284b);
--band:light-dark(#1847a8,#10265c);--red:light-dark(#b5391d,#ff917a);--red-soft:light-dark(#fbe8e1,#3a1e19);
--bronze:light-dark(#8a5718,#dcae6f);--bronze-soft:light-dark(#f8eedf,#2a2217);--sh:light-dark(rgba(17,24,38,.08),rgba(0,0,0,.5))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Assistant,Rubik,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:Rubik,Assistant,sans-serif;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,5vw,40px);font-weight:800;line-height:1.08}
h2{font-size:21px;font-weight:700;line-height:1.2}
h3{font-size:18px;font-weight:700;line-height:1.25}
p{margin:0}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
textarea{resize:vertical}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--blue);margin:0;flex:none}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 45%,transparent);outline-offset:1px}
button{cursor:pointer;border:0;border-radius:12px;min-height:44px;padding:0 16px;font-weight:600;background:var(--panel);color:var(--ink);transition:background .15s,border-color .15s,color .15s,transform .08s}
button:active{transform:scale(.97)}
button.pri{background:var(--blue);color:var(--on)}
button.pri:hover{background:color-mix(in srgb,var(--blue) 88%,var(--ink))}
button.ghost{background:var(--bg);border:1.5px solid var(--line)}
button.ghost:hover{border-color:var(--blue)}
button.ghost.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
button.danger{background:var(--bg);border:1.5px solid var(--red);color:var(--red)}
button.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
button.link{background:none;min-height:32px;padding:0 2px;color:var(--blue);text-decoration:underline;text-underline-offset:3px;font-weight:600}
button:disabled{opacity:.45;cursor:default;transform:none}
svg.i{width:18px;height:18px;flex:none}
/* header band with the flag's stripe */
.top{position:sticky;top:0;z-index:30;background:var(--band);color:#fff;box-shadow:0 6px 0 var(--bg),0 10px 0 var(--band)}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px max(4vw,14px)}
.brand{display:flex;align-items:center;gap:12px;background:none;color:#fff;padding:0;min-height:52px;text-align:start}
.brand img{height:48px;width:auto;border-radius:10px;background:#fff;padding:2px 4px}
.brand b{display:block;font:700 18px/1.1 Rubik,sans-serif}
.brand small{display:block;font-size:13px;opacity:.85;font-weight:400}
.top nav{margin-inline-start:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.top nav button{background:none;color:#fff;min-height:40px;padding:0 12px;font-size:15px}
.top nav button:hover{background:rgba(255,255,255,.14)}
.top nav button.on{background:#fff;color:#1847a8}
.sync{display:none;font-size:13px;white-space:nowrap;padding:0 6px;opacity:.92}
.sync.show{display:inline}
.sync.err{opacity:1;background:#fff;color:#b5391d;border-radius:99px;padding:2px 10px;font-weight:700}
main{max-width:1240px;margin:0 auto;padding:30px max(4vw,14px) 110px}
/* shared bits */
.muted{color:var(--mute)}.small{font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end}.grow{flex:1}
.sec{margin:30px 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec .muted{font:400 14px Assistant,sans-serif}
.panel{background:var(--panel);border-radius:18px;padding:18px}
.tag{display:inline-block;font-size:13px;line-height:1.5;padding:0 8px;border-radius:99px;background:var(--blue-soft);color:var(--blue);font-weight:600;white-space:nowrap;vertical-align:middle}
.tag.red{background:var(--red-soft);color:var(--red)}.tag.br{background:var(--bronze-soft);color:var(--bronze)}
.banner{background:var(--bronze-soft);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.banner.err{background:var(--red-soft);color:var(--ink)}
.warn{background:var(--bronze-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:15px}
.empty{padding:34px 16px;text-align:center;color:var(--mute)}
.quiet{background:var(--panel);border-radius:16px;padding:18px;color:var(--mute)}
.f2{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
label.fld{display:grid;gap:5px;font-size:14px;font-weight:600}
label.chk{display:flex;gap:10px;align-items:center;font-size:15px;cursor:pointer;min-height:36px}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(7em,1fr));margin:18px 0}
.kpi{background:var(--panel);border-radius:16px;padding:14px 16px;font-size:14px;color:var(--mute)}
.kpi b{display:block;font:800 clamp(26px,4vw,34px)/1.1 Rubik,sans-serif;color:var(--ink);white-space:nowrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0 10px}
.toolbar input[type=search]{flex:1 1 220px;width:auto}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:13px;padding:1px 8px;border-radius:8px;border:1px solid var(--line);white-space:nowrap;background:var(--bg)}
.chip.v{background:var(--blue-soft);color:var(--blue);border-color:transparent}.chip.x{background:var(--red-soft);color:var(--red);border-color:transparent}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:color-mix(in srgb,var(--mute) 30%,transparent);flex:none}
.dot.v{background:var(--blue)}.dot.x{background:var(--red)}
.dots{display:inline-flex;gap:3px;align-items:center}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;min-width:70px;flex:1}.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.pct{display:flex;align-items:center;gap:8px;min-width:130px}.pct span{min-width:3ch;text-align:end;font-variant-numeric:tabular-nums}
.spark{display:flex;align-items:flex-end;gap:2px;height:24px;width:80px}.spark i{flex:1;background:var(--blue);opacity:.8;border-radius:2px 2px 0 0;min-height:2px}
/* home */
.intro{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between}
.intro .lead{font-size:18px;color:var(--mute);margin-top:6px}
.intro .me{min-width:min(100%,240px)}
.tgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.tcard{display:grid;gap:8px;text-align:start;padding:20px;border-radius:20px;background:var(--band);color:#fff;font-weight:400;min-height:0;box-shadow:0 10px 24px -16px var(--sh)}
.tcard:hover{background:color-mix(in srgb,var(--band) 90%,#000)}
.tcard .t1{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:15px;opacity:.9}
.tcard b{font:800 24px/1.15 Rubik,sans-serif}
.tcard .tb{height:8px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}.tcard .tb i{display:block;height:100%;background:#fff;border-radius:99px}
.tcard .go{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;margin-top:4px}
.tcard .go span:last-child{background:#fff;color:#1847a8;border-radius:10px;padding:6px 12px;white-space:nowrap}
.daylbl{margin:26px 0 10px;font:700 16px Rubik,sans-serif;color:var(--bronze);display:flex;gap:8px;align-items:baseline}
.daylbl small{font:400 14px Assistant,sans-serif;color:var(--mute)}
.cgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.ccard{display:grid;gap:4px;text-align:start;padding:14px 16px;background:var(--bg);border:1.5px solid var(--line);border-radius:16px;font-weight:400;min-height:0}
.ccard:hover{border-color:var(--blue)}
.ccard .c1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ccard b{font:700 18px/1.25 Rubik,sans-serif}
.ccard .time{font-weight:700;color:var(--blue);white-space:nowrap;font-variant-numeric:tabular-nums}
/* session */
.sess-top{display:grid;gap:8px;margin-bottom:16px}
.sess-top .sub{color:var(--mute);font-size:15px}
.datebar{display:grid;gap:10px;margin-bottom:12px}
.dnav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dnav button{min-width:44px;padding:0;font-size:18px}
.dnav input{width:auto;flex:0 1 190px}
.dlabel{font:600 17px Rubik,sans-serif}
.dates{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 0 6px;scrollbar-width:thin}
.dchip{flex:none;scroll-snap-align:start;display:grid;justify-items:center;gap:0;min-width:64px;min-height:52px;padding:6px 10px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;line-height:1.2}
.dchip small{font-weight:400;color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.dchip.has{border-color:color-mix(in srgb,var(--blue) 45%,var(--line))}
.dchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.dchip.on small{color:inherit;opacity:.8}
.sess{display:grid;gap:18px}
@media(max-width:899px){.sess .tally{order:2}}
@media(min-width:900px){.sess{grid-template-columns:minmax(0,1fr) 330px;align-items:start}.sess .tally{position:sticky;top:96px;grid-column:2;grid-row:1}.sess .rost{grid-column:1;grid-row:1}}
.tally{background:var(--panel);border-radius:20px;padding:18px;display:grid;gap:14px}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:14px;color:var(--mute)}
.nums b{display:block;font:800 clamp(30px,6vw,42px)/1 Rubik,sans-serif;font-variant-numeric:tabular-nums}
.nums .nv b{color:var(--blue)}.nums .nx b{color:var(--red)}.nums .nu b{color:var(--ink)}
.segbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--panel2)}
.segbar i{display:block;height:100%;transition:width .3s}.segbar .bv{background:var(--blue)}.segbar .bx{background:var(--red)}
.tact{display:grid;gap:8px}
.snote{font-size:15px;display:grid;gap:4px;justify-items:start}
.snote p{background:var(--bronze-soft);border-radius:10px;padding:8px 12px;width:100%}
.sfilter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.sfilter input{flex:1 1 200px;width:auto}
.grp{margin:14px 0 6px;font:700 15px Rubik,sans-serif;color:var(--bronze)}
.list{display:grid;gap:8px}
.stu{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:16px;background:var(--bg);transition:background .15s,border-color .15s}
.stu.v{background:var(--blue-soft);border-color:color-mix(in srgb,var(--blue) 40%,var(--line))}
.stu.x{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.stu .nm{font-weight:700;font-size:18px;line-height:1.25}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center;font-size:14px;color:var(--mute);margin-top:2px}
.marks{display:flex;gap:6px}
.mk{min-width:104px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:var(--bg);font-size:16px;min-height:48px}
.mk.v.on{background:var(--blue);border-color:var(--blue);color:var(--on)}
.mk.x.on{background:var(--red);border-color:var(--red);color:var(--on)}
.note{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.note input{min-height:40px;padding:8px 10px;background:var(--bg)}
.meta .link{min-height:28px;font-size:14px}
.addbox{border:1.5px dashed var(--bronze);border-radius:16px;padding:16px;display:grid;gap:12px;background:var(--bronze-soft)}
.addbtn{width:100%;border-style:dashed!important;margin-top:12px}
.dock{display:none}
@media(max-width:899px){.dock{position:fixed;inset-inline:0;bottom:0;z-index:25;display:flex;gap:10px;align-items:center;background:var(--bg);border-top:1px solid var(--line);padding:10px max(4vw,14px) calc(10px + env(safe-area-inset-bottom));box-shadow:0 -8px 20px -14px var(--sh)}
.dock .dk{flex:1;font-size:15px;font-variant-numeric:tabular-nums}.dock .cv{color:var(--blue)}.dock .cx{color:var(--red)}.dock .ok{color:var(--blue);font-weight:700}}
/* admin overview */
.week{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.wday{background:var(--panel);border-radius:16px;padding:12px;display:grid;gap:6px;align-content:start}
.wday.is-today{outline:2px solid var(--blue);outline-offset:-2px}
.wh{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--mute);padding:0 2px 2px}
.wh b{font:700 16px Rubik,sans-serif;color:var(--ink)}
.witem{display:grid;gap:0;text-align:start;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;min-height:0;font-weight:400;font-size:14px}
.witem b{font-size:15px;line-height:1.3}
.witem.ok span{color:var(--blue);font-weight:600}
.witem.miss{border-color:color-mix(in srgb,var(--red) 50%,var(--line))}.witem.miss span{color:var(--red);font-weight:700}
.witem.up{opacity:.7}.witem.up span{color:var(--mute)}
.two{display:grid;gap:18px;margin-top:8px}
@media(min-width:900px){.two{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}
.trend{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;height:220px;margin-top:14px}
.tcol{display:flex;flex-direction:column;height:100%;text-align:center}
.tcol .tbx{flex:1;position:relative}
.tcol .tbx i{position:absolute;bottom:0;inset-inline:0;background:var(--blue);border-radius:6px 6px 0 0;min-height:2px}
.tcol.cur .tbx i{background:color-mix(in srgb,var(--blue) 40%,var(--panel2))}
.tcol .tbx i span{position:absolute;bottom:100%;inset-inline:-4px;font-size:13px;font-weight:600;padding-bottom:3px;font-variant-numeric:tabular-nums}
.tcol .tl{font-size:13px;color:var(--mute);padding-top:6px;white-space:nowrap;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
@media(max-width:560px){.tcol:nth-child(even) .tl,.tcol:nth-child(even) .tbx span{visibility:hidden}}
.risk{display:grid;gap:6px;margin-top:12px}
.rk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.rk .meta{grid-column:1/-1}
.rk a.tel{white-space:nowrap;direction:ltr;font-weight:600}
/* tables */
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:14px;max-height:76vh;background:var(--bg)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:15px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap;background:var(--bg)}
thead th{position:sticky;top:0;background:var(--panel);font:600 14px Rubik,sans-serif;z-index:2;vertical-align:bottom}
tbody tr:last-child td{border-bottom:0}
tfoot td{position:sticky;bottom:0;background:var(--panel);font-weight:700;z-index:1;border-top:1px solid var(--line);border-bottom:0}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums}
td.ph{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:var(--blue-soft)}
.reg th.fix,.reg td.fix{position:sticky;right:0;z-index:1;box-shadow:-1px 0 0 var(--line)}
.reg thead th.fix,.reg tfoot td.fix{z-index:3}
.reg td.c{text-align:center;cursor:pointer;min-width:56px;padding:6px 4px;font-weight:700;border-inline-start:1px solid var(--line)}
.reg td.c:hover{outline:2px solid var(--blue);outline-offset:-2px}
.reg td.c.v{background:var(--blue-soft);color:var(--blue)}.reg td.c.x{background:var(--red-soft);color:var(--red)}
.reg td.c.off{background:var(--panel);cursor:default;color:var(--mute)}
.reg td.c small{display:block;font-weight:500;font-size:13px;line-height:1.2;color:var(--bronze);max-width:120px;margin:2px auto 0;overflow:hidden;text-overflow:ellipsis}
.reg th.d{text-align:center;cursor:pointer;border-inline-start:1px solid var(--line);padding:8px 6px}
.reg th.d:hover{background:var(--blue-soft)}
.reg th.d small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.reg th.d.hasnote{color:var(--bronze)}
tr.removed td{color:var(--mute)}tr.removed td.fix a{text-decoration:line-through}
.notetbl td.nt{white-space:normal;min-width:220px}
/* student page */
.scards{display:grid;gap:12px;margin-top:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.notes{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:4px;font-size:15px}
.notes li b{color:var(--bronze);margin-inline-end:6px}
/* dialog + toast */
.scrim{position:fixed;inset:0;background:rgba(8,12,22,.5);display:grid;place-items:center;padding:16px;z-index:60;animation:fade .15s ease-out}
.dlg{background:var(--bg);border-radius:20px;padding:22px;width:min(540px,100%);max-height:88vh;overflow:auto;display:grid;gap:14px;box-shadow:0 24px 60px -20px rgba(0,0,0,.55);animation:up .2s ease-out}
@media(max-width:600px){.scrim{place-items:end stretch;padding:0}.dlg{border-radius:22px 22px 0 0;max-height:92vh;padding-bottom:calc(22px + env(safe-area-inset-bottom))}}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(16px);opacity:.6}}
.seg{display:flex;gap:6px}.seg button{flex:1;border:1.5px solid var(--line);background:var(--bg)}
.seg button.on.v{background:var(--blue);color:var(--on);border-color:var(--blue)}.seg button.on.x{background:var(--red);color:var(--on);border-color:var(--red)}.seg button.on.n{background:var(--panel2)}
.linkbox{font-size:14px;direction:ltr;text-align:left;overflow-wrap:anywhere;background:var(--panel);padding:8px 10px;border-radius:10px}
.pick{max-height:42vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.toast{position:fixed;bottom:22px;inset-inline-start:50%;transform:translate(50%,20px);background:var(--ink);color:var(--bg);padding:8px 8px 8px 18px;padding-inline-start:18px;border-radius:99px;font-weight:600;display:flex;gap:10px;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:70;max-width:calc(100% - 28px)}
.toast.show{opacity:1;transform:translate(50%,0);pointer-events:auto}
.toast button{min-height:34px;background:var(--bg);color:var(--ink);border-radius:99px;font-size:14px}
.toast:not(:has(button)){padding:10px 18px}
@media(max-width:899px){.toast{bottom:88px}}
@media(max-width:600px){
  .brand img{height:42px}.brand small{display:none}.top nav button{padding:0 9px;font-size:14px}
  .stu{grid-template-columns:minmax(0,1fr)}.marks .mk{flex:1}

/* ---------- index (rebuilt each render) ---------- */
let X = {sess:{}, ensC:{}, ensS:{}};
function buildIndex(){
  const sess = {}, ensC = {}, ensS = {};
  for (const [id, s] of Object.entries(S.sessions)) { if (!s || !s.courseId || !s.date) continue; (sess[s.courseId] ||= []).push({id, date:s.date, records:s.records||{}, note:s.note||''}); }
  for (const k in sess) sess[k].sort((a,b) => a.date.localeCompare(b.date));
  for (const [id, e] of Object.entries(S.enrollments)) { if (!e) continue; const x = {id, ...e, st: S.students[e.studentId] || {name:'(תלמיד לא נמצא)'}}; (ensC[e.courseId] ||= []).push(x); (ensS[e.studentId] ||= []).push(x); }
  X = {sess, ensC, ensS};
}
const csess = cid => X.sess[cid] || [];
const countV = recs => { let v = 0, x = 0; for (const r of Object.values(recs||{})) { if (r?.s === 'v') v++; else if (r?.s === 'x') x++; } return {v, x}; };
function rec(cid, date, sid){
  const id = sessId(cid, date);
  const base = S.sessions[id]?.records?.[sid] || {};
  return {s:'', n:'', ...base, ...(overlay[id+'|'+sid]||{})};
}
const courseEnrollments = cid => X.ensC[cid] || [];
function rosterFor(cid, date){
  return courseEnrollments(cid).filter(e => e.active || (e.removedAt && e.removedAt > date))
    .sort((a,b) => (a.group||'').localeCompare(b.group||'','he') || byName(a.st,b.st));
}
const courseSessions = cid => csess(cid).map(s => s.date);
const heldDates = cid => csess(cid).filter(s => countV(s.records).v).map(s => s.date);
function courseStats(cid){
  let v = 0, x = 0, held = 0, last = '';
  for (const s of csess(cid)) { const c = countV(s.records); if (c.v) { held++; if (s.date > last) last = s.date; } v += c.v; x += c.x; }
  const active = courseEnrollments(cid).filter(e => e.active).length;
  return {v, x, held, last, active, pct: v+x ? Math.round(100*v/(v+x)) : null};
}
function studentStats(cid, sid){
  let v = 0, x = 0; const items = [];
  for (const s of csess(cid)) { const r = s.records[sid]; if (!r) continue; if (r.s==='v') v++; if (r.s==='x') x++; if (r.s||r.n) items.push({date:s.date, ...r}); }
  return {v, x, items, pct: v+x ? Math.round(100*v/(v+x)) : null};
}
const activeCourses = () => Object.entries(S.courses).filter(([,c]) => c && !c.archived).map(([id,c]) => ({id,...c}))
  .sort((a,b) => (a.day??9)-(b.day??9) || (a.time||'').localeCompare(b.time||'') || (a.order||0)-(b.order||0));
const allInstructors = () => [...new Set(Object.values(S.courses).filter(c => c && !c.archived).flatMap(c => c.instructors||[]))].sort((a,b) => a.localeCompare(b,'he'));
const pctTxt = p => p == null ? '–' : p + '%';
const pctBar = p => p == null ? '<span class="muted">–</span>' : `<div class="pct"><div class="bar"><i style="width:${p}%"></i></div><span>${p}%</span></div>`;

/* ---------- status + toast ---------- */
let syncT, toastT;
function saving(msg, ok, err){
  const el = $('#sync'); el.textContent = msg; el.className = 'sync show' + (err ? ' err' : ''); clearTimeout(syncT);
  if (ok) syncT = setTimeout(() => el.classList.remove('show','err'), err ? 5000 : 1600);
  if (err) toast(msg);
}
function toast(msg, opt = {}){
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${opt.undo ? '<button id="toastUndo">ביטול</button>' : ''}`;
  el.classList.add('show'); clearTimeout(toastT);
  if (opt.undo) $('#toastUndo').onclick = () => { el.classList.remove('show'); opt.undo(); };
  toastT = setTimeout(() => el.classList.remove('show'), opt.undo ? 6000 : 2200);
}

/* ---------- writes ---------- */
function enqueue(path, fn){
  saving('שומר…');
  const p = (queues[path] || Promise.resolve()).then(fn);
  queues[path] = p.catch(() => {});
  return p.then(() => saving('נשמר ✓', true)).catch(e => {
    saving(e?.code === 'invalid_argument' ? 'אין הרשאת כתיבה – פנו למנהל' : e?.code === 'quota_exceeded' ? 'מסד הנתונים מלא – פנו למנהל' : 'השמירה נכשלה, נסו שוב', true, true);
    console.error(e); throw e;
  });
}
function needDb(){ if (!db) { saving('אין חיבור למסד הנתונים', true, true); return false; } return true; }
function setRecord(cid, date, sid, patch){
  if (!needDb()) return;
  const id = sessId(cid, date), k = id+'|'+sid;
  if ('n' in patch) patch = {...patch, t: patch.n ? new Date().toISOString() : ''};
  overlay[k] = {...(overlay[k]||{}), ...patch}; render();
  return enqueue('sessions/'+id, async () => {
    const ref = db.doc('sessions/'+id);
    const snap = await ref.get();
    if (snap.exists) await ref.update({records:{[sid]:patch}, updatedAt:new Date().toISOString()});
    else await ref.set({courseId:cid, date, note:'', records:{[sid]:{s:'',n:'',...patch}}, updatedAt:new Date().toISOString()});
  }).finally(() => { delete overlay[k]; render(); });
}
function setMany(cid, date, recs){
  if (!needDb()) return;
  const id = sessId(cid, date);
  for (const sid in recs) overlay[id+'|'+sid] = {...(overlay[id+'|'+sid]||{}), ...recs[sid]};
  render();
  return enqueue('sessions/'+id, async () => {
    const ref = db.doc('sessions/'+id); const snap = await ref.get();
    if (snap.exists) await ref.update({records:recs, updatedAt:new Date().toISOString()});
    else await ref.set({courseId:cid, date, note:'', records:recs, updatedAt:new Date().toISOString()});
  }).finally(() => { for (const sid in recs) delete overlay[id+'|'+sid]; render(); });
}
const writeDoc = (path, data, merge) => needDb() && enqueue(path, () => merge ? db.doc(path).update(data) : db.doc(path).set(data));
function setSessionNote(cid, date, v){
  if (!needDb()) return;
  const id = sessId(cid, date);
  return enqueue('sessions/'+id, async () => { const ref = db.doc('sessions/'+id), sn = await ref.get();
    if (sn.exists) await ref.update({note:v, noteT: v ? new Date().toISOString() : ''});
    else if (v) await ref.set({courseId:cid, date, note:v, noteT:new Date().toISOString(), records:{}, updatedAt:new Date().toISOString()}); });
}

/* ---------- routing ---------- */
function route(){
  const h = location.hash.slice(1);
  let m;
  if ((m = h.match(/^course-([A-Za-z0-9]+)(?:-(\d{8}))?$/))) return {v:'session', cid:m[1], date: m[2] ? fromCompact(m[2]) : null};
  if ((m = h.match(/^admin-session-([A-Za-z0-9]+)-(\d{8})$/))) return {v:'session', cid:m[1], date:fromCompact(m[2]), admin:true};
  if ((m = h.match(/^admin-course-([A-Za-z0-9]+)$/))) return {v:'acourse', cid:m[1]};
  if ((m = h.match(/^admin-student-([A-Za-z0-9]+)$/))) return {v:'astudent', sid:m[1]};
  if (h === 'admin-students') return {v:'astudents'};
  if (h === 'admin-settings') return {v:'asettings'};
  if (h === 'admin') return {v:'aover'};
  return {v:'home'};
}
const go = h => { if (location.hash.slice(1) === h) render(); else location.hash = h; };
const sessDate = {}; // remembered date per course for this visit
const lastClassDay = cid => { const c = S.courses[cid], t = today(); return c && c.day != null ? addDays(t, -((parseISO(t).getDay() - c.day + 7) % 7)) : t; };
const curDate = r => r.date || sessDate[r.cid] || lastClassDay(r.cid);

function renderNav(r){

/* ---------- session (marking) ---------- */
const openNotes = new Set(); const pendingNotes = {}; let addOpen = false;
function dateChips(cid, date){
  const c = S.courses[cid], t = today(), set = new Set([t, date]);
  for (const s of csess(cid)) if (s.date >= addDays(t, -49) && s.date <= addDays(t, 7)) set.add(s.date);
  if (c.day != null) { let d = addDays(t, -((parseISO(t).getDay() - c.day + 7) % 7)); for (let i = 0; i < 5; i++) { set.add(d); d = addDays(d, -7); } }
  let ds = [...set].sort().reverse().slice(0, 10); if (!ds.includes(date)) ds.push(date);
  const has = new Set(csess(cid).filter(s => Object.keys(s.records).length).map(s => s.date));
  return ds.map(d => `<button class="dchip ${d===date?'on':''} ${has.has(d)?'has':''}" data-date="${d}" aria-pressed="${d===date}"><span>${d===t ? 'היום' : DSHORT[parseISO(d).getDay()]}</span><small>${dm(d)}</small></button>`).join('');
}

function weekBoard(){
  const t = today(), ws = weekStart(t), act = activeCourses();
  const days = [0,1,2,3,4,5,6].filter(d => act.some(c => c.day === d));
  let due = 0, done = 0;
  const cols = days.map(d => {
    const date = addDays(ws, d);
    const items = act.filter(c => c.day === d).map(c => {
      const cv = countV(S.sessions[sessId(c.id, date)]?.records), fut = date > t;
      const st = fut ? 'up' : cv.v + cv.x ? 'ok' : 'miss';
      if (!fut) { due++; if (st === 'ok') done++; }
      return `<button class="witem ${st}" data-go="admin-session-${c.id}-${compact(date)}"><b>${esc(c.name)}</b><span>${c.time ? esc(c.time)+' · ' : ''}${st==='ok' ? cv.v+' הגיעו' : st==='miss' ? 'לא סומן' : 'בהמשך השבוע'}</span></button>`;
    }).join('');
    return `<div class="wday ${date===t?'is-today':''}"><div class="wh"><b>${DAYS[d]}</b><span>${dm(date)}${date===t?' · היום':''}</span></div>${items}</div>`;
  }).join('');
  const title = due ? `השבוע סומנו ${done} מתוך ${due} מפגשים שכבר התקיימו` : 'השבוע עוד לא התקיימו מפגשים';
  return `<h2 class="sec">${title}<span class="muted">לחיצה על מפגש פותחת אותו לעריכה</span></h2>${days.length ? `<div class="week">${cols}</div>` : '<div class="quiet">אין חוגים עם יום קבוע.</div>'}`;
}
function trendBox(){
  const ws = weekStart(today()), weeks = [];
  for (let i = 11; i >= 0; i--) weeks.push(addDays(ws, -7*i));
  const sum = Object.fromEntries(weeks.map(w => [w, 0]));
  for (const s of Object.values(S.sessions)) { if (!s?.date || !S.courses[s.courseId]) continue; const w = weekStart(s.date); if (w in sum) sum[w] += countV(s.records).v; }
  const max = Math.max(1, ...Object.values(sum)), last = sum[weeks[10]], prev = sum[weeks[9]], diff = last - prev;
  const head = last || prev ? `בשבוע שעבר נרשמו ${last} נוכחויות${prev ? `, ${diff === 0 ? 'כמו' : (diff > 0 ? diff+' יותר' : -diff+' פחות')+' מ'}בשבוע שלפניו` : ''}` : 'נוכחויות לפי שבוע';
  return `<div class="panel"><h2>${head}</h2><p class="muted small" style="margin-top:4px">סך סימוני ״הגיע״ בכל החוגים, 12 השבועות האחרונים. העמודה הבהירה היא השבוע הנוכחי.</p>
    <div class="trend">${weeks.map((w,i) => `<div class="tcol ${i===11?'cur':''}"><div class="tbx"><i style="height:${(86*sum[w]/max).toFixed(1)}%"><span>${sum[w] || ''}</span></i></div><span class="tl">${dm(w)}</span></div>`).join('')}</div></div>`;
}

let lastFocus = null;
function modal(html, bind){
  lastFocus = document.activeElement;
  $('#modal').innerHTML = `<div class="scrim" id="scrim"><div class="dlg" role="dialog" aria-modal="true">${html}</div></div>`;
  $('#scrim').onclick = e => { if (e.target.id === 'scrim') closeModal(); };
  bind && bind($('#modal .dlg'));
  setTimeout(() => ($('#modal .dlg input:not([type=hidden]):not([type=checkbox]), #modal .dlg textarea') || $('#modal .dlg button'))?.focus(), 30);
}
const closeModal = () => { if (!$('#modal').innerHTML) return; $('#modal').innerHTML = ''; try { lastFocus?.focus({preventScroll:true}); } catch {} };
function confirmBox(text, okText, fn, danger){

}

async function splitCourse(src, nid, course, moveSids, opts = {}){
  const sc = S.courses[src] || {};
  const now = new Date().toISOString();
  if (!S.courses[nid]) await writeDoc('courses/'+nid, {name:course.name, day: course.day !== undefined ? course.day : (sc.day ?? null), time: course.time || '',
    instructors: course.instructors || sc.instructors || [], archived:false, order: Date.now()});
  const moveSet = new Set(moveSids);
  for (const sid of moveSids) {
    const eid = `${src}_${sid}`, e = S.enrollments[eid];
    if (!e) continue;
    await writeDoc(`enrollments/${nid}_${sid}`, {...e, courseId:nid});
    await enqueue('enrollments/'+eid, () => db.doc('enrollments/'+eid).delete());
  }
  for (const [id, se] of Object.entries(S.sessions)) {
    if (se.courseId !== src) continue;
    const moved = {};
    for (const sid in (se.records || {})) if (moveSet.has(sid)) moved[sid] = se.records[sid];
    const has = Object.keys(moved).length > 0;
    if (!has && (!se.note || !moveSids.length)) continue;
    const tid = sessId(nid, se.date);
    await enqueue('sessions/'+tid, async () => { const ref = db.doc('sessions/'+tid), sn = await ref.get();
      if (sn.exists) { if (has) await ref.update({records:moved}); }
      else await ref.set({courseId:nid, date:se.date, note:se.note || '', records:moved, updatedAt:now}); });
    if (has) await enqueue('sessions/'+id, async () => { const ref = db.doc('sessions/'+id), sn = await ref.get(); if (!sn.exists) return;
      const d = sn.data(), r = {...(d.records || {})}; for (const sid of moveSids) delete r[sid];
      await ref.set({...d, records:r, updatedAt:now}); });
  }
  if (opts.srcPatch) await writeDoc('courses/'+src, opts.srcPatch, true);
  for (const sid of opts.addExisting || []) if (!S.enrollments[`${nid}_${sid}`]) await enroll(nid, sid);
  for (const st of opts.addNew || []) {
    const ex = Object.entries(S.enrollments).some(([,e]) => e.courseId === nid && S.students[e.studentId]?.name === st.name);
    if (!ex) await createStudent({name:st.name, mother:st.mother || '', phone:normPhone(st.phone), age:st.age || ''}, nid);
  }
}

async function runPlan(){
  if (!needDb() || planBusy) return;
  planBusy = 'מכין…'; render();
  try {
    const plan = await (await fetch('split-plan.json')).json();
    let n = 0;
    for (const sp of plan.splits) {
      planBusy = `מפצל: ${S.courses[sp.src]?.name || sp.src} (${++n} מתוך ${plan.splits.length})…`; render();
      await splitCourse(sp.src, sp.newId, sp.course, sp.move || [], {srcPatch:sp.srcPatch, addExisting:sp.addExisting, addNew:sp.addNew});
    }
    for (const [sid, patch] of Object.entries(plan.studentPatches || {})) if (S.students[sid]) await writeDoc('students/'+sid, patch, true);
    await writeDoc('config/app', {...S.config, [PLAN_KEY]: true});
    planBusy = ''; saving('הפיצול הושלם ✓', true); render();
  } catch (e) { console.error(e); planBusy = ''; saving('הפיצול נעצר באמצע – לחצו שוב כדי להמשיך', true, true); render(); }
}

/* ---------- copy / export ---------- */
async function copyText(t, msg){ try { await navigator.clipboard.writeText(t); toast(msg||'הועתק ✓'); } catch { modal(`<h3>העתקה ידנית</h3><p class="small muted">ההעתקה האוטומטית לא זמינה כאן. סמנו והעתיקו:</p><textarea rows="8" readonly>${esc(t)}</textarea><div class="row end"><button class="ghost" data-x>סגירה</button></div>`, d => { d.querySelector('[data-x]').onclick = closeModal; d.querySelector('textarea').select(); }); } }
const clean = v => String(v ?? '').replace(/[\t\r\n]+/g, ' ');
function copyTable(k){ const t = TBL[k]; if (!t) return; copyText([t.head, ...t.rows].map(r => r.map(clean).join('\t')).join('\n'), 'הטבלה הועתקה, אפשר להדביק באקסל'); }
async function exportCsv(k){
  const t = TBL[k]; if (!t) return;
  const csv = '﻿' + [t.head, ...t.rows].map(r => r.map(v => `"${clean(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const fn = `${t.name} ${today()}.csv`.replace(/[\\/:*?"<>|]/g,'-');
  try { const dl = await claude.use('downloads'); if (!dl) throw 0; await dl.save({filename:fn, data:csv}); }
  catch (e) { if (e?.code === 'cancelled' || e?.name === 'AbortError') return; copyText(csv.slice(1), 'הורדה לא זמינה, ה-CSV הועתק'); }
}
function summaryText(cid, date){
  const ro = rosterFor(cid, date);
  const yes = ro.filter(en => rec(cid,date,en.studentId).s==='v').map(en=>en.st.name), no = ro.filter(en => rec(cid,date,en.studentId).s==='x').map(en=>en.st.name);
  const notes = ro.filter(en => rec(cid,date,en.studentId).n).map(en => `${en.st.name}: ${rec(cid,date,en.studentId).n}`);
  const sn = S.sessions[sessId(cid,date)]?.note;
  return `${S.courses[cid].name} – יום ${wd(date)} ${dm(date)}${sn ? '\nהערה: '+sn : ''}\nהגיעו (${yes.length}): ${yes.join(', ')}\nלא הגיעו (${no.length}): ${no.join(', ')}${notes.length?'\nהערות:\n'+notes.join('\n'):''}`;
}

    for (const en of rosterFor(r.cid, date)) if (!rec(r.cid, date, en.studentId).s) recs[en.studentId] = {s:'v'};
    const n = Object.keys(recs).length; if (!n) return;
    const undo = Object.fromEntries(Object.keys(recs).map(sid => [sid, {s:''}]));
    return setMany(r.cid, date, recs)?.then(() => toast(n === 1 ? 'תלמיד אחד סומן כהגיע' : `${n} תלמידים סומנו כהגיעו`, {undo: () => setMany(r.cid, date, undo)?.catch(()=>{})})).catch(()=>{}); }

  if (t.id === 'sessNoteBtn') return sessNoteDialog(r.cid, curDate(r));
  if (t.id === 'onlyUn') { ui.onlyUn = !ui.onlyUn; return render(); }
  if (t.id === 'openAdd') { addOpen = true; render(); return $('#a-name')?.focus(); }
  if (t.id === 'cancelAdd') { addOpen = false; return render(); }
  if (t.id === 'allC') { ui.allCourses = true; return render(); }
  if (t.id === 'mineC') { ui.allCourses = false; return render(); }

  if (t.id === 'doPlan') return runPlan();

  if (t.id === 'links') return linksDialog(r.cid);
  if (t.id === 'addStu') return enrollDialog(r.cid);
  if (t.id === 'openSess') return go(`admin-session-${r.cid}-${compact($('#openDate').value || today())}`);
  if (t.dataset.colmenu) return colMenu(r.cid, t.dataset.colmenu);
  if (t.id === 'moreNotes') { ui.showAllNotes = true; return render(); }
  if (t.id === 'moreRisk') { ui.showAllRisk = !ui.showAllRisk; return render(); }
  if (t.dataset.stuf) { ui.stuF = t.dataset.stuf; return render(); }
  if (t.dataset.delnote) { const [id, sid] = t.dataset.delnote.split('|'); const se = S.sessions[id]; if (!se) return;
    const who = sid ? (S.students[sid]?.name || '') : 'המפגש';
    return confirmBox(`למחוק את ההערה של ${who} מ-${dm(se.date)}?`, 'מחיקה', () => sid ? setRecord(se.courseId, se.date, sid, {n:''})?.catch(()=>{}) : setSessionNote(se.courseId, se.date, '')?.catch(()=>{}), true); }
  if (t.dataset.cell) return cellDialog(r.cid, t.dataset.cell, t.dataset.sid);
  if (t.dataset.remove) { const en = S.enrollments[t.dataset.remove]; const nm = S.students[en?.studentId]?.name || '';
    return confirmBox(`להסיר את ${nm} מהחוג? ההיסטוריה והערות העבר יישמרו.`, 'הסרה', () => writeDoc('enrollments/'+t.dataset.remove, {active:false, removedAt:today()}, true)?.catch?.(()=>{}), true); }
  if (t.dataset.restore) return writeDoc('enrollments/'+t.dataset.restore, {active:true, removedAt:null}, true)?.catch?.(()=>{});
  if (t.id === 'editStu') return studentDialog(r.sid);
  if (t.id === 'enrollStu') return enrollDialog(null, r.sid);
  if (t.id === 'logout') { isAdmin = false; ss.del('admin'); return go(''); }
  if (t.dataset.copytbl) return copyTable(t.dataset.copytbl);
  if (t.dataset.csv) return exportCsv(t.dataset.csv);
});
function setSessDate(r, d){
  if (!d || !/^\d{4}-\d{2}-\d{2}$/.test(d)) return; sessDate[r.cid] = d; addOpen = false;
  if (r.admin) return go(`admin-session-${r.cid}-${compact(d)}`);
  if (r.date) return go(`course-${r.cid}-${compact(d)}`);
  render();
}

  if (t.id === 'arch') { ui.showArchived = t.checked; return render(); }
  if (t.id === 'regRemoved') { ui.regRemoved = t.checked; return render(); }
  if (t.dataset.note) { const date = curDate(r); const sid = t.dataset.note, k = r.cid+date+sid;
    pendingNotes[k] = t.value; clearTimeout(noteTimers[k]);

});

(async () => {
  const timer = setTimeout(() => { if (!S.loaded.courses) { S.err = 'לא ניתן להגיע לנתונים כרגע. בדקו את החיבור לאינטרנט.'; render(); } }, 10000);
  try { db = await claude.use('db'); user = await claude.use('user'); } catch {}
  if (!db) { clearTimeout(timer); S.err = 'אין חיבור למסד הנתונים. יש לפתוח את האפליקציה מחובר/ת לחשבון claude.ai עם גישה אליה.'; S.loaded.courses = true; render(); return; }
  try { canEditLevel = !!(await user?.isOwner()); } catch {}
  try { const cw = await user?.can?.('data.write'); if (cw === false) canWrite = false; } catch {}
  if (canEditLevel) isAdmin = true;
  const sub = (col, key) => db.collection(col).onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); }); S[key] = m;
    if (!snap.metadata.fromCache) { S.loaded[key] = true; if (key === 'courses') { clearTimeout(timer); S.err = ''; } }
    else if (key === 'courses') S.loaded.courses = true;
    render();
  }, err => { clearTimeout(timer); S.err = 'שגיאה בטעינת הנתונים ('+(err?.code||'')+').'; S.loaded.courses = true; render(); });
  sub('courses','courses'); sub('students','students'); sub('enrollments','enrollments'); sub('sessions','sessions');
  db.doc('config/app').onSnapshot(d => { S.config = d.exists ? d.data() : {}; if (!canEditLevel) isAdmin = ss.get('admin') === (S.config.codeHash || DEFAULT_CODE_HASH); render(); }, () => {});
})();
